<script type="module">
import * as THREE from 'three';
const BLOCKS={
grass:{c:0x5fb85c,drop:'dirt'},dirt:{c:0x8B4513,drop:'dirt'},stone:{c:0x7a7a7a,drop:'cobble',tool:'pick'},sand:{c:0xF4E4BC,drop:'sand'},log:{c:0x5C4033,drop:'log',tool:'axe'},leaves:{c:0x2d8a4e,drop:'sapling'},planks:{c:0xDEB887,drop:'planks'},cobble:{c:0x6e6e6e,drop:'cobble',tool:'pick'},bedrock:{c:0x0a0a0a,drop:'',hard:999},glass:{c:0xaaddff,drop:'',op:0.25},coal_ore:{c:0x1c1c1c,drop:'coal',tool:'pick'},iron_ore:{c:0xd8d8d8,drop:'iron_raw',tool:'pick'},gold_ore:{c:0xFFD700,drop:'gold_raw',tool:'pick'},diamond_ore:{c:0x00ffff,drop:'diamond',tool:'pick'},obsidian:{c:0x1a0a3a,drop:'obsidian',tool:'pick',hard:22},netherrack:{c:0x6a2a2a,drop:'netherrack'},glowstone:{c:0xffffaa,drop:'glowstone',light:1},end_stone:{c:0xeeefaa,drop:'end_stone'},end_frame:{c:0x2a5a2a,drop:'end_frame',hard:999},portal:{c:0x8a2be2,drop:'',op:0.5,light:1},end_portal:{c:0x000000,drop:'',op:0.8,light:1},craft:{c:0x8B5A2B,drop:'craft'},furnace:{c:0x555,drop:'furnace'},chest:{c:0xCD853F,drop:'chest'},torch:{c:0xffee88,drop:'torch',light:1},redstone:{c:0xff0000,drop:'redstone',light:0.4},piston:{c:0xaaaaaa,drop:'piston'},tnt:{c:0xff2222,drop:'tnt'},slime:{c:0x55ff55,drop:'slime',op:0.7},ice:{c:0x88ccff,drop:'',op:0.6},water:{c:0x2a7fff,drop:'',op:0.55},lava:{c:0xff4400,drop:'',op:0.85,light:1}
};
const TOOLS={wood_pick:{t:'pick'},stone_pick:{t:'pick'},diamond_pick:{t:'pick'},diamond_sword:{t:'sword',dmg:14},flint_steel:{t:'fire'},elytra:{t:'elytra'}};
const RECIPES={craft:{need:{planks:4},out:'craft'},stick:{need:{planks:2},out:'stick',count:4},wood_pick:{need:{planks:3,stick:2},out:'wood_pick'},torch:{need:{coal:1,stick:1},out:'torch',count:4},chest:{need:{planks:8},out:'chest'}};
let scene,camera,renderer,worldGroup,player={x:0,y:42,z:0,vy:0,health:20,hunger:20,xp:0,lvl:0,flying:false},yaw=0,pitch=0,keys={},chunks=new Map(),mobs=[],drops=[],inv={},hotbar=[],sel=0,raycaster=new THREE.Raycaster(),joy={x:0,y:0},mode='survival',dimension='overworld',portalCD=0,peer=null,myId=null,connections={},otherPlayers={},weather=0,weatherTimer=0;
function openMP(){let b=document.getElementById('mpBox');b.style.display=b.style.display==='none'?'block':'none';if(!peer)initPeer();}
function initPeer(){peer=new Peer(Math.random().toString(36).substr(2,6).toUpperCase());peer.on('open',id=>{myId=id;document.getElementById('myCode').innerText=id;document.getElementById('net').innerText='ID:'+id;});peer.on('connection',conn=>{conn.on('open',()=>{connections[conn.peer]=conn;conn.on('data',d=>handleNet(d,conn.peer));showMsg(`+ ${conn.peer} joined`);});});}
window.host=()=>{isHost=true;document.getElementById('mpBox').style.display='none';start(mode,true);};
window.join=()=>{let code=document.getElementById('joinCode').value.trim().toUpperCase();if(!code)return;if(!peer)peer=new Peer();peer.on('open',()=>{let c=peer.connect(code);c.on('open',()=>{connections[code]=c;c.on('data',d=>handleNet(d,code));document.getElementById('mpBox').style.display='none';start(mode,true);document.getElementById('net').innerText='JOINED:'+code;showMsg('Joined '+code);});});};
function handleNet(d,f){if(d.type==='pos'){if(!otherPlayers[f]){let g=new THREE.Group();let b=new THREE.Mesh(new THREE.BoxGeometry(0.6,1.2,0.6),new THREE.MeshLambertMaterial({color:0x00e5ff}));let h=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.5,0.5),new THREE.MeshLambertMaterial({color:0xffdbac}));h.position.y=0.85;g.add(b,h);worldGroup.add(g);otherPlayers[f]=g;}otherPlayers[f].position.set(d.x,d.y,d.z);}if(d.type==='break'){worldGroup.traverse(o=>{if(o.position&&o.position.x===d.x&&o.position.y===d.y&&o.position.z===d.z&&o.userData.type)o.parent.remove(o);});}if(d.type==='place'){placeBlockRaw(d.x,d.y,d.z,d.bt);}if(d.type==='chat'){addChat(`${f}: ${d.msg}`);}if(d.type==='dim')switchDim(d.dim);}
function broadcast(o){Object.values(connections).forEach(c=>{try{c.send(o);}catch(e){}});}
function addChat(t){let b=document.getElementById('chatBox');b.innerHTML+=`<div>> ${t}</div>`;b.scrollTop=b.scrollHeight;}
window.sendChat=()=>{let i=document.getElementById('chatIn');if(!i.value)return;addChat(`Du: ${i.value}`);broadcast({type:'chat',msg:i.value});i.value='';};
window.start=(m,multi=false)=>{mode=m;document.getElementById('menu').style.display='none';['hud','cross','joy','right','look','plist'].forEach(id=>{document.getElementById(id).style.display=id==='hud'?'flex':'flex';});document.getElementById('cross').style.display='block';if(multi&&!peer)initPeer();init();};
function init(){scene=new THREE.Scene();scene.background=new THREE.Color(0x87CEEB);scene.fog=new THREE.Fog(0x87CEEB,80,260);camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,0.1,800);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);worldGroup=new THREE.Group();scene.add(worldGroup);scene.add(new THREE.AmbientLight(0xffffff,0.75));let sun=new THREE.DirectionalLight(0xffffff,1.1);sun.position.set(120,180,60);scene.add(sun);hotbar=['diamond_pick','diamond_sword','flint_steel','obsidian','torch','planks','water','lava','end_frame','elytra','redstone','tnt'];Object.keys(BLOCKS).forEach(k=>inv[k]=0);Object.keys(TOOLS).forEach(k=>inv[k]=0);if(mode==='creative'){Object.keys(BLOCKS).forEach(k=>inv[k]=999);Object.keys(TOOLS).forEach(k=>inv[k]=1);inv.stick=99;inv.coal=99;}else{inv={log:12,planks:24,stick:12,cobble:32,coal:8,torch:24,wood_pick:1,obsidian:14,flint_steel:1,diamond:2,redstone:16,piston:4,ender_eye:3,end_frame:2,elytra:1,craft:1,chest:2,water:10,lava:5,tnt:12};}buildHotbar();genOverworld(0,0);spawnMobs(20);bind();loop();}
function getBiome(x,z){let n=Math.sin(x*0.01)*Math.cos(z*0.01);if(n>0.4)return 'desert';if(n<-0.35)return 'snow';if(Math.sin(x*0.03+z*0.02)>0.7)return 'forest';return 'plains';}
function getH(x,z){let b=getBiome(x,z);let base=14+Math.sin(x*0.05)*4+Math.cos(z*0.05)*4+Math.sin(x*0.012+z*0.013)*9;if(b==='desert')return Math.floor(base+2);if(b==='snow')return Math.floor(base+6);return Math.floor(base);}
function placeBlockRaw(x,y,z,type){if(!BLOCKS[type])return;let b=BLOCKS[type];let mat=new THREE.MeshLambertMaterial({color:b.c,transparent:!!b.op,opacity:b.op||1});if(b.light){mat.emissive=new THREE.Color(b.c);mat.emissiveIntensity=0.9;}let m=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),mat);m.position.set(x,y,z);m.userData={type,hard:b.hard||2};worldGroup.add(m);return m;}
function addBlock(g,x,y,z,type){let m=placeBlockRaw(x,y,z,type);if(g!==worldGroup)g.add(m);return m;}
function genOverworld(cx,cz){for(let dx=-4;dx<=4;dx++)for(let dz=-4;dz<=4;dz++){let key=`o_${cx+dx},${cz+dz}`;if(chunks.has(key))continue;let g=new THREE.Group();for(let x=0;x<16;x++)for(let z=0;z<16;z++){let wx=(cx+dx)*16+x,wz=(cz+dz)*16+z,biome=getBiome(wx,wz),hh=getH(wx,wz);let top=biome==='desert'?'sand':biome==='snow'?'ice':'grass';addBlock(g,wx,hh,wz,top);addBlock(g,wx,hh-1,wz,top==='grass'?'dirt':top);addBlock(g,wx,hh-2,wz,'dirt');for(let y=hh-3;y>hh-10;y--)addBlock(g,wx,y,wz,'stone');for(let y=-2;y<=1;y++)addBlock(g,wx,y,wz,'bedrock');if(Math.random()<0.02)addBlock(g,wx,hh,wz,'coal_ore');if(Math.random()<0.008)addBlock(g,wx,hh-4,wz,'iron_ore');if(Math.random()<0.002)addBlock(g,wx,hh-8,wz,'diamond_ore');if(biome==='plains'&&Math.random()<0.015){for(let yy=1;yy<=4;yy++)addBlock(g,wx,hh+yy,wz,'log');for(let ox=-2;ox<=2;ox++)for(let oy=0;oy<=2;oy++)for(let oz=-2;oz<=2;oz++)if(Math.abs(ox)+Math.abs(oz)+oy<4)addBlock(g,wx+ox,hh+5+oy,wz+oz,'leaves');}if(Math.random()<0.001){for(let ox=-2;ox<=2;ox++)for(let oz=-2;oz<=2;oz++)addBlock(g,wx+ox,hh-3,wz+oz,'end_frame');}if(biome==='desert'&&Math.random()<0.005){for(let y=hh;y<hh+3;y++)for(let ox=-1;ox<=1;ox++)for(let oz=-1;oz<=1;oz++)if(Math.random()<0.6)addBlock(g,wx+ox,y,wz+oz,'water');}}worldGroup.add(g);chunks.set(key,g);}}
function genNether(cx,cz){for(let dx=-4;dx<=4;dx++)for(let dz=-4;dz<=4;dz++){let k=`n_${cx+dx},${cz+dz}`;if(chunks.has(k))continue;let g=new THREE.Group();for(let x=0;x<16;x++)for(let z=0;z<16;z++){let wx=(cx+dx)*16+x,wz=(cz+dz)*16+z;for(let y=0;y<55;y++)if(Math.random()<0.88)addBlock(g,wx,y,wz,Math.random()<0.08?'glowstone':Math.random()<0.05?'lava':'netherrack');}worldGroup.add(g);chunks.set(k,g);}}
function genEnd(cx,cz){for(let dx=-4;dx<=4;dx++)for(let dz=-4;dz<=4;dz++){let k=`e_${cx+dx},${cz+dz}`;if(chunks.has(k))continue;let g=new THREE.Group();for(let x=0;x<16;x++)for(let z=0;z<16;z++){let wx=(cx+dx)*16+x,wz=(cz+dz)*16+z;for(let y=0;y<18;y++)addBlock(g,wx,y,wz,'end_stone');}let dragon=new THREE.Group();let body=new THREE.Mesh(new THREE.BoxGeometry(4,2,8),new THREE.MeshLambertMaterial({color:0x111}));dragon.add(body);dragon.position.set((cx+dx)*16+8,32,(cz+dz)*16+8);dragon.userData={type:'dragon',health:200,hostile:true};worldGroup.add(dragon);mobs.push(dragon);worldGroup.add(g);chunks.set(k,g);}}
function clearWorld(){worldGroup.children.forEach(c=>{if(!Object.values(otherPlayers).includes(c))worldGroup.remove(c);});mobs=[];drops=[];chunks.clear();}
function switchDim(to){if(portalCD>0)return;portalCD=140;showMsg(`🌀 Teleport zu ${to.toUpperCase()}...`,2000);setTimeout(()=>{clearWorld();dimension=to;document.getElementById('dim').innerText=to.toUpperCase();if(to==='nether'){scene.fog=new THREE.Fog(0x440000,25,140);scene.background=new THREE.Color(0x330000);genNether(0,0);}else if(to==='end'){scene.fog=new THREE.Fog(0x000000,40,300);scene.background=new THREE.Color(0x050005);genEnd(0,0);}else{scene.fog=new THREE.Fog(0x87CEEB,80,260);scene.background=new THREE.Color(0x87CEEB);genOverworld(Math.floor(player.x/16),Math.floor(player.z/16));}broadcast({type:'dim',dim:to});},700);}
function spawnMobs(n){for(let i=0;i<n;i++){let x=(Math.random()-0.5)*120,z=(Math.random()-0.5)*120,y=getH(x,z)+1;let g=new THREE.Group();g.position.set(x,y,z);let r=Math.random();let type=r<0.3?'zombie':r<0.5?'creeper':r<0.7?'skeleton':'cow';let col=type==='zombie'?0xff4444:type==='creeper'?0x55ff55:type==='skeleton'?0xeeeeee:0xffffff;let body=new THREE.Mesh(new THREE.BoxGeometry(0.8,0.9,0.8),new THREE.MeshLambertMaterial({color:col}));let head=new THREE.Mesh(new THREE.BoxGeometry(0.6,0.6,0.6),new THREE.MeshLambertMaterial({color:type==='creeper'?0x55ff55:type==='cow'?0xffdbac:0x440000}));head.position.y=0.7;g.add(body,head);g.userData={type,health:type==='creeper'?20:20,hostile:type!=='cow',vy:0,creeperTimer:0};worldGroup.add(g);mobs.push(g);}}
function spawnDrop(x,y,z,type){if(!type||type==='')return;let col=BLOCKS[type]?.c||0xffffff;let m=new THREE.Mesh(new THREE.BoxGeometry(0.28,0.28,0.28),new THREE.MeshLambertMaterial({color:col}));m.position.set(x,y,z);m.userData={drop:type,vy:0.18};worldGroup.add(m);drops.push(m);}
function buildHotbar(){let hb=document.getElementById('hotbar');hb.innerHTML='';hotbar.forEach((t,i)=>{let d=document.createElement('div');d.className='slot'+(i===sel?' sel':'');let icon=t==='water'?'🌊':t==='lava'?'🔥':t==='tnt'?'💥':t==='torch'?'🔦':t==='elytra'?'🪽':'🧱';d.innerHTML=`<i>${icon}</i><span>${t.slice(0,6)}</span><b>${inv[t]||0}</b>`;d.onclick=()=>{sel=i;buildHotbar();};hb.appendChild(d);});document.getElementById('hearts').innerText='❤️'.repeat(Math.ceil(player.health/4))||'💀';document.getElementById('hunger').innerText='🍗'.repeat(Math.ceil(player.hunger/4));document.getElementById('xp').innerText=`LVL ${player.lvl}`;document.getElementById('coords').innerText=`${Math.floor(player.x)},${Math.floor(player.y)},${Math.floor(player.z)}`;document.getElementById('dim').innerText=dimension.toUpperCase();document.getElementById('biome').innerText=getBiome(player.x,player.z).toUpperCase();}
function showMsg(t,ms=2200){let m=document.getElementById('msg');m.style.display='block';m.innerHTML=t;setTimeout(()=>m.style.display='none',ms);}
function tryPortal(hit){let pos=hit.object.position;let obs=[];worldGroup.traverse(o=>{if(o.userData?.type==='obsidian'&&o.position.distanceTo(pos)<8)obs.push(o);});if(obs.length>=10&&hotbar[sel]==='flint_steel'){let xs=obs.map(b=>b.position.x),ys=obs.map(b=>b.position.y),zs=obs.map(b=>b.position.z);let minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys),z=zs[0];if(maxX-minX>=3&&maxY-minY>=4){for(let x=minX+1;x<maxX;x++)for(let y=minY+1;y<maxY;y++)placeBlockRaw(x,y,z,'portal');showMsg('NETHER PORTAL AN! 🔥 Reinlaufen!');return true;}}if(hit.object.userData.type==='portal'&&portalCD<=0)switchDim(dimension==='overworld'?'nether':'overworld');if(hit.object.userData.type==='end_portal'&&portalCD<=0)switchDim('end');if(hit.object.userData.type==='end_frame'&&hotbar[sel]==='ender_eye'){hit.object.material.color.set(0x00ff00);showMsg('Eye eingesetzt!');inv['ender_eye']--;buildHotbar();let frames=[];worldGroup.traverse(o=>{if(o.userData?.type==='end_frame'&&o.material.color.getHex()===0x00ff00)frames.push(o);});if(frames.length>=3){let cx=frames[0].position.x,cz=frames[0].position.z;for(let x=cx-1;x<=cx+1;x++)for(let z=cz-1;z<=cz+1;z++)placeBlockRaw(x,0,z,'end_portal');showMsg('END PORTAL AKTIVIERT! 👁️');}}return false;}
function doAction(){raycaster.setFromCamera(new THREE.Vector2(0,0),camera);let hits=raycaster.intersectObjects(worldGroup.children,true);let real=hits.filter(h=>!h.object.userData.drop);if(real.length>0&&real[0].distance<6){if(tryPortal(real[0]))return;let t=real[0].object.userData.type;if(t==='tnt'){let p=real[0].object.position;real[0].object.parent.remove(real[0].object);showMsg('💥 BOOM!');let toRem=[];worldGroup.traverse(o=>{if(o.position&&o.position.distanceTo(p)<6&&o.userData.type&&o.userData.type!=='bedrock')toRem.push(o);});toRem.forEach(o=>o.parent.remove(o));}if(t==='chest'||t==='craft'){document.getElementById('inv').style.display='flex';buildFullInv();}}}
function doBreak(){raycaster.setFromCamera(new THREE.Vector2(0,0),camera);let hits=raycaster.intersectObjects(worldGroup.children,true);let real=hits.filter(h=>!h.object.userData.drop&&h.object.userData.type);if(real.length>0&&real[0].distance<5.5){let obj=real[0].object;if(obj.userData.type==='bedrock')return;let pos=obj.position.clone();obj.parent.remove(obj);if(BLOCKS[obj.userData.type]?.drop)spawnDrop(pos.x,pos.y+0.5,pos.z,BLOCKS[obj.userData.type].drop);broadcast({type:'break',x:pos.x,y:pos.y,z:pos.z});}}
function doPlace(){raycaster.setFromCamera(new THREE.Vector2(0,0),camera);let hits=raycaster.intersectObjects(worldGroup.children,true);let real=hits.filter(h=>!h.object.userData.drop&&h.object.userData.type);if(real.length>0&&real[0].distance<6){let h=real[0];let type=hotbar[sel];if(mode==='survival'&&(inv[type]||0)<=0&&type!=='elytra')return;let np=h.object.position.clone().add(h.face.normal);placeBlockRaw(np.x,np.y,np.z,type);broadcast({type:'place',x:np.x,y:np.y,z:np.z,bt:type});if(mode==='survival')inv[type]--;buildHotbar();}}
function buildFullInv(){let div=document.getElementById('fullInv');div.innerHTML='';Object.entries(inv).forEach(([k,v])=>{if(v<=0)return;let s=document.createElement('div');s.className='gSlot';s.innerHTML=`🧱<br>${k.slice(0,6)}<br><b>${v}</b>`;s.onclick=()=>{if(!hotbar.includes(k)){if(hotbar.length>=9)hotbar[sel]=k;else hotbar.push(k);buildHotbar();}else{sel=hotbar.indexOf(k);buildHotbar();}};div.appendChild(s);});let res=document.getElementById('craftRes');res.innerHTML='';Object.entries(RECIPES).forEach(([name,r])=>{let ok=true;Object.entries(r.need).forEach(([need,cnt])=>{if((inv[need]||0)<cnt)ok=false;});if(ok){let b=document.createElement('button');b.className='btn b3';b.style.width='auto';b.style.padding='6px 10px';b.innerText=`CRAFT ${r.out} x${r.count||1}`;b.onclick=()=>{Object.entries(r.need).forEach(([need,cnt])=>inv[need]-=cnt);inv[r.out]=(inv[r.out]||0)+(r.count||1);buildFullInv();buildHotbar();showMsg(`Gecraftet: ${r.out}`);};res.appendChild(b);}});}
window.closeInv=()=>document.getElementById('inv').style.display='none';
window.clearDrops=()=>{drops.forEach(d=>worldGroup.remove(d));drops=[];showMsg('Cleared');};
function bind(){let joyEl=document.getElementById('joy'),stick=document.getElementById('stick');joyEl.addEventListener('touchmove',e=>{e.preventDefault();let t=e.touches[0],r=joyEl.getBoundingClientRect(),cx=r.left+59,cy=r.top+59,dx=t.clientX-cx,dy=t.clientY-cy,dist=Math.min(42,Math.hypot(dx,dy)),ang=Math.atan2(dy,dx);joy.x=Math.cos(ang)*dist/42;joy.y=Math.sin(ang)*dist/42;stick.style.left=34+joy.x*42+'px';stick.style.top=34+joy.y*42+'px';},{passive:false});joyEl.addEventListener('touchend',()=>{joy.x=0;joy.y=0;stick.style.left='34px';stick.style.top='34px';});let look=document.getElementById('look'),lastX=0,lastY=0;look.addEventListener('touchstart',e=>{lastX=e.touches[0].clientX;lastY=e.touches[0].clientY;});look.addEventListener('touchmove',e=>{e.preventDefault();let dx=e.touches[0].clientX-lastX,dy=e.touches[0].clientY-lastY;yaw-=dx*0.01;pitch=Math.max(-1.55,Math.min(1.55,pitch-dy*0.01));lastX=e.touches[0].clientX;lastY=e.touches[0].clientY;},{passive:false});document.getElementById('bBreak').addEventListener('touchstart',e=>{e.preventDefault();doBreak();});document.getElementById('bPlace').addEventListener('touchstart',e=>{e.preventDefault();doPlace();});document.getElementById('bAct').addEventListener('touchstart',e=>{e.preventDefault();doAction();});document.getElementById('bFly').addEventListener('touchstart',e=>{e.preventDefault();player.flying=!player.flying;showMsg(player.flying?'🪽 FLUG AN':'Flug AUS');});document.getElementById('bJump').addEventListener('touchstart',e=>{e.preventDefault();if(player.vy===0)player.vy=0.36;if(player.flying)player.y+=0.9;});document.getElementById('bInv').addEventListener('touchstart',e=>{e.preventDefault();document.getElementById('inv').style.display='flex';buildFullInv();});document.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyE'){let s=document.getElementById('inv');s.style.display=s.style.display==='flex'?'none':'flex';if(s.style.display==='flex')buildFullInv();}if(e.code==='KeyF')doAction();if(e.code>='Digit1'&&e.code<='Digit9'){sel=parseInt(e.code[1])-1;if(sel<hotbar.length)buildHotbar();}if(e.code==='Space'){if(player.flying)player.y+=0.6;else if(player.vy===0)player.vy=0.36;}});document.addEventListener('keyup',e=>keys[e.code]=false);}
function loop(){requestAnimationFrame(loop);if(!renderer)return;if(portalCD>0)portalCD--;weatherTimer--;if(weatherTimer<=0){weather=Math.random()<0.25?1:0;weatherTimer=600+Math.random()*800;document.getElementById('weather').innerText=weather?'🌧️':'☀️';if(weather){scene.fog=new THREE.Fog(0x888888,60,180);scene.background=new THREE.Color(0x6a7a8a);}else{if(dimension==='overworld'){scene.fog=new THREE.Fog(0x87CEEB,80,260);scene.background=new THREE.Color(0x87CEEB);}}}let speed=player.flying?0.36:0.19;if(keys['ShiftLeft']&&player.flying)player.y-=speed;let mx=joy.x,my=joy.y;if(keys['KeyW'])my=1;if(keys['KeyS'])my=-1;if(keys['KeyA'])mx=1;if(keys['KeyD'])mx=-1;player.x+=Math.sin(yaw)*my*speed*1.8 - Math.sin(yaw+Math.PI/2)*mx*speed*1.8;player.z+=Math.cos(yaw)*my*speed*1.8 - Math.cos(yaw+Math.PI/2)*mx*speed*1.8;player.vy-=0.02;player.y+=player.vy;let gh=dimension==='overworld'?getH(player.x,player.z)+2.2:26;if(player.y<gh){player.y=gh;player.vy=0;}if(dimension==='overworld'&&Math.floor(player.x/16)!==0){let cx=Math.floor(player.x/16),cz=Math.floor(player.z/16);genOverworld(cx,cz);}camera.position.set(player.x,player.y+1.7,player.z);camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;if(Object.keys(connections).length>0&&Math.random()<0.12)broadcast({type:'pos',x:player.x,y:player.y,z:player.z,yaw});drops.forEach((d,i)=>{d.rotation.y+=0.07;d.position.y+=Math.sin(Date.now()*0.004+i)*0.01+d.userData.vy;d.userData.vy-=0.01;if(d.position.y<getH(d.position.x,d.position.z)+0.4){d.position.y=getH(d.position.x,d.position.z)+0.4;d.userData.vy=0;}if(d.position.distanceTo(camera.position)<1.8){inv[d.userData.drop]=(inv[d.userData.drop]||0)+1;worldGroup.remove(d);drops.splice(i,1);buildHotbar();}});mobs.forEach(m=>{if(m.userData.hostile){let dist=m.position.distanceTo(camera.position);if(dist<20){let dir=new THREE.Vector3().subVectors(camera.position,m.position).normalize();m.position.add(dir.multiplyScalar(0.04));if(m.userData.type==='creeper'){if(dist<6){m.userData.creeperTimer++;if(m.userData.creeperTimer>60){showMsg('💥 CREEPER BOOM!');let toRem=[];worldGroup.traverse(o=>{if(o.position&&o.position.distanceTo(m.position)<5&&o.userData.type&&o.userData.type!=='bedrock')toRem.push(o);});toRem.forEach(o=>o.parent.remove(o));worldGroup.remove(m);mobs=mobs.filter(x=>x!==m);}}else{m.userData.creeperTimer=0;}}}if(dist<1.5&&Math.random()<0.02){player.health-=2;buildHotbar();showMsg(`💔 Hit von ${m.userData.type}! ❤️${player.health}`);if(player.health<=0){player.health=20;player.x=0;player.y=40;player.z=0;showMsg('💀 Gestorben! Respawn!');}}}});if(Math.random()<0.006)spawnMobs(1);renderer.render(scene,camera);}
</script></body></html>
